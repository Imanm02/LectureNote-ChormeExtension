  <circle cx="416" cy="252" r="91" fill="#fffaf5" opacity=".035"/>
  <circle cx="416" cy="252" r="61" fill="none" stroke="#fffaf5" stroke-opacity=".09" stroke-width="2"/>
  <rect x="37" y="39" width="202" height="202" rx="52" fill="#0d151d" fill-opacity=".45" stroke="#fffaf5" stroke-opacity=".12" stroke-width="2"/>
