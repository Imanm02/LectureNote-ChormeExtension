    </linearGradient>
    <radialGradient id="accent" cx="0" cy="0" r="1" gradientTransform="translate(68 43) rotate(41) scale(253 221)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="440" height="280" fill="url(#background)"/>
